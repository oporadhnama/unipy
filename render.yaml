services:
  - type: web
    name: freellmapi
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: 3001
      - key: ADMIN_PASSWORD
        value: changeme
